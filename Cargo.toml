[package]
name = "pubcrawl"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["macros", "ws"] }
axum-htmx = "0.8.1"
dotenvy = "0.15.7"
flate2 = "1.1.2"
futures = "0.3.31"
futures-util = "0.3.31"
listenfd = "1.0.2"
maud = { version = "0.27.0", features = ["axum"] }
notify = "8.2.0"
redis = { version = "0.32.5", features = ["tokio-comp", "connection-manager"] }
redis-derive = { version = "0.2.0", git = "https://github.com/kkharji/redis-derive" }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
strum = { version = "0.27.2", features = ["derive", "strum_macros"] }
tokio = { version = "1.47.1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower = "0.5.2"
tower-cookies = "0.11.0"
tower-http = { version = "0.6.6", features = ["fs", "set-header"] }
tower-livereload = "0.9.6"
